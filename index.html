<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CondoGestor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa no desktop, abas no topo no celular; conteudo em paineis com tabelas densas. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#eaeff1; --line:#d7dfe3;
  --fg:#16232b; --muted:#5b6b75; --accent:#0b7a75; --accent-fg:#ffffff; --accent-soft:#d9efed;
  --ok:#17803d; --ok-soft:#dcf1e3; --warn:#a15c07; --warn-soft:#fbebcf; --bad:#b42318; --bad-soft:#fbe0dd;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Schibsted Grotesk','Segoe UI',system-ui,sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --surface:#16232a; --surface-2:#1d2d36; --line:#2a3d48;
  --fg:#e5edf0; --muted:#93a5af; --accent:#3cc4bb; --accent-fg:#06211f; --accent-soft:#16413f;
  --ok:#5fd68a; --ok-soft:#173a26; --warn:#f2b45a; --warn-soft:#3d2e12; --bad:#ff8a7d; --bad-soft:#44201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171c; --surface:#16232a; --surface-2:#1d2d36; --line:#2a3d48;
  --fg:#e5edf0; --muted:#93a5af; --accent:#3cc4bb; --accent-fg:#06211f; --accent-soft:#16413f;
  --ok:#5fd68a; --ok-soft:#173a26; --warn:#f2b45a; --warn-soft:#3d2e12; --bad:#ff8a7d; --bad-soft:#44201c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto}
aside{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px}
.brand h1{font-size:19px}
.brand small{display:block;color:var(--muted);font-size:12px}
.roles{display:flex;flex-direction:column;gap:4px}
.roles label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{text-align:left;background:none;border:0;border-radius:7px;padding:9px 11px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
nav button:hover{background:var(--surface-2);color:var(--fg)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-family:var(--font-data);font-size:12px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h2{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h3{font-size:16px;margin-bottom:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-family:var(--font-data);font-weight:500;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--surface-2);color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
form.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
form.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
form.f .wide{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar .pair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bar i{display:block;width:40%;max-width:26px;border-radius:4px 4px 0 0;background:var(--accent)}
.bar i.d{background:var(--warn)}
.bar span{font-size:11px;color:var(--muted);font-family:var(--font-data)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column}
.item{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:10px 0}
.mini{width:92px;padding:5px 7px}
a.btn{display:inline-block;text-decoration:none}
a.btn.wa{background:var(--ok-soft);color:var(--ok)}
.subtabs{display:flex;gap:4px;min-width:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 18px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.subtabs button:hover{color:var(--fg)}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.checks input{width:auto}
form.f label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:14px}
.note{margin:0 0 12px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
.unit-card{display:flex;flex-wrap:wrap;gap:6px 24px}
.unit-card div{min-width:120px}
.unit-card small{display:block;color:var(--muted);font-size:12px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{position:static}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav button{white-space:nowrap}
  .head h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.block-board{display:block;padding-bottom:8px}
.block-column{width:100%;max-width:none;flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.block-column>h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.unit-grid>*{min-width:0}
.unit-tile{min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px;margin:0;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.unit-tile:hover,.unit-tile:focus-visible{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
.unit-tile-head{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:nowrap}
.unit-tile-head>b{min-width:0;overflow-wrap:anywhere}
.unit-tile-head .pill{flex:0 0 auto;white-space:nowrap}
.unit-tile p{margin:4px 0 0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit-detail-head,.unit-detail-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit-modal-backdrop{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,20,28,.62);overscroll-behavior:contain}
.unit-detail{width:min(760px,100%);max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;margin:0;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.unit-detail>h4{margin:18px 0 4px}
.unit-modal-open{overflow:hidden}
.unit-detail-head h3,.unit-detail-head p{margin:0}
.unit-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:14px 0}
.unit-detail-grid>div{background:var(--surface-2);border-radius:7px;padding:9px}
.unit-detail-grid small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.unit-detail-grid b{overflow-wrap:anywhere}
.unit-detail-actions{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
@media(max-width:520px){.unit-detail-actions{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.unit-modal-backdrop{padding:10px}.unit-detail{max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}}
.unit-tile-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.unit-tile-stats div{background:var(--surface-2);border-radius:6px;padding:7px;font-size:12px}
.unit-tile-stats b{display:block;color:var(--fg);font-size:14px}
.unit-tile-actions{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px}
.resident-app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.resident-app-brand{display:flex;align-items:center;gap:10px;min-width:0}
.resident-app-brand>div:last-child{min-width:0}
.resident-app-brand b{display:block;font-family:var(--font-display);font-size:16px}
.resident-app-brand small{display:block;color:var(--muted);font-size:12px;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resident-month{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.resident-month select{width:auto;min-width:118px;padding:7px 26px 7px 9px;font-size:13px}
.resident-bottom-nav{display:none}
.resident-app .resident-main{gap:14px}
.resident-app .head h2{font-size:25px}
.resident-app .head p{font-size:14px}
.resident-app .panel{border-radius:14px}
.resident-shortcuts{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.resident-shortcut{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;color:var(--fg);cursor:pointer}
.resident-shortcut small,.resident-news small{color:var(--muted);font-size:12px}
.resident-shortcut b{font-family:var(--font-data);font-size:20px}
.resident-shortcut span{font-size:12px;color:var(--muted)}
.resident-news{display:flex;align-items:center;justify-content:space-between;gap:12px}
.resident-news>div{min-width:0}
.resident-news b{display:block;margin-top:3px}
.resident-news p{margin:4px 0 0;color:var(--muted);font-size:13px}
@media(max-width:820px){
  #app.resident-app{display:block;max-width:600px;min-height:100dvh;margin:0 auto}
  #app.resident-app>aside{display:none}
  #app.resident-app>.resident-main{gap:13px;padding:2px 0 calc(92px + env(safe-area-inset-bottom,0px))}
  #app.resident-app .resident-app-header{position:sticky;top:0;z-index:10;margin:0 -2px;padding:10px 12px;border-radius:0 0 16px 16px;box-shadow:0 5px 20px rgba(16,35,43,.07);border-top:0}
  #app.resident-app .resident-app-brand .brand-mark{width:36px;height:36px;border-radius:11px}
  #app.resident-app .resident-month{display:block}
  #app.resident-app .resident-month span{display:block;margin:0 0 2px 2px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  #app.resident-app .resident-month select{min-width:112px;max-width:132px;padding:6px 22px 6px 8px;border-radius:9px}
  #app.resident-app .resident-main>.head{padding:2px 3px}
  #app.resident-app .resident-main>.head h2{font-size:23px}
  #app.resident-app .resident-main>.head p{font-size:13px}
  #app.resident-app .panel{padding:14px;border-radius:15px}
  #app.resident-app .grid{grid-template-columns:minmax(0,1fr);gap:12px}
  #app.resident-app .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  #app.resident-app .kpi{padding:11px;border-radius:13px}
  #app.resident-app .kpi b{font-size:19px}
  #app.resident-app .unit-card{gap:12px 18px}
  #app.resident-app .resident-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  #app.resident-app .resident-shortcut{padding:12px}
  #app.resident-app .resident-shortcut:last-child{grid-column:1/-1}
  #app.resident-app .resident-news{align-items:flex-start;flex-direction:column}
  #app.resident-app .resident-bottom-nav{position:fixed;display:flex;z-index:30;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 20px));justify-content:space-around;gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 32px rgba(16,35,43,.18);backdrop-filter:blur(14px)}
  #app.resident-app .resident-bottom-nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;border-radius:12px;padding:5px 2px;color:var(--muted);font-size:10px;font-weight:600;white-space:normal}
  #app.resident-app .resident-bottom-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  #app.resident-app .resident-bottom-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #app.resident-app .resident-bottom-nav button:hover{background:var(--surface-2);color:var(--fg)}
}
@media(max-width:360px){#app.resident-app .resident-bottom-nav button{font-size:9px}#app.resident-app .resident-bottom-nav svg{width:18px;height:18px}}
</style>

<div class="shell" id="app"></div>

<script type="module" src="/src/main.js"></script>

</body></html>
